<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Quote Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="quote-card">

            <h1>✨ Random Quote Generator</h1>

            <div class="quote-box">

                <div class="quote-icon">❝</div>

                <p id="quote">
                    Click the button to get an inspiring quote!
                </p>

                <h3 id="author">— Author</h3>

            </div>

            <div class="buttons">

                <button id="newQuoteBtn">
                    🔄 New Quote
                </button>

                <button id="shareBtn">
                    📤 Share
                </button>

            </div>

        </div>

        <footer>
            <p>Task 8 • Web Development Track • Keerthi Balaga</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
